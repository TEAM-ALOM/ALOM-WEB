<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALOM</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    color: #1a1a2e;
    line-height: 1.6;
  }

  nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 1rem 2rem;
    border-bottom: 1px solid #eee;
    position: sticky;
    top: 0;
    background: #fff;
  }

  .logo {
    font-weight: 700;
    font-size: 1.25rem;
    color: #4338ca;
  }

  .nav-links {
    display: flex;
    gap: 2rem;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: #1a1a2e;
    font-weight: 500;
  }

  .nav-links a:hover,
  .nav-links a:focus-visible {
    color: #4338ca;
  }

  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 6rem 2rem;
    text-align: center;
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
  }

  p.subtitle {
    color: #555;
    font-size: 1.1rem;
    margin-bottom: 2rem;
  }

  .btn {
    display: inline-block;
    background: #4338ca;
    color: #fff;
    padding: 0.75rem 1.75rem;
    border-radius: 8px;
    text-decoration: none;
    font-weight: 600;
  }

  .btn:hover,
  .btn:focus-visible {
    background: #3730a3;
  }

  @media (max-width: 600px) {
    nav { flex-direction: column; gap: 1rem; }
    .nav-links { gap: 1rem; flex-wrap: wrap; justify-content: center; }
    h1 { font-size: 1.75rem; }
  }
</style>
</head>
<body>
  <nav>
    <div class="logo">ALOM</div>
    <ul class="nav-links">
      <li><a href="/alom">홈</a></li>
      <li><a href="/alom/curriculum">커리큘럼</a></li>
      <li><a href="/alom/question">자주 묻는 질문</a></li>
      <li><a href="/alom/archive">아카이브</a></li>
      <li><a href="/alom/member">아롬인들</a></li>
    </ul>
  </nav>

  <main id="home">
    <h1>ALOM에 오신 걸 환영해요</h1>
    <p class="subtitle">테스트용 페이지</p>
    <a href="#about" class="btn">더 알아보기</a>
  </main>
</body>
</html>
