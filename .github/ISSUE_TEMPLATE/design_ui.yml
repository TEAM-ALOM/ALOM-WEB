name: "🎨 디자인 / UI 개선"
description: "레이아웃, 스타일, 사용자 경험 관련 개선 사항을 제안합니다"
title: "[디자인] "
labels: ["디자인", "작업전"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 대상 영역
      options:
        - 레이아웃
        - 색상/톤앤매너
        - 타이포그래피
        - 반응형(모바일)
        - 접근성
        - 기타
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 현재 상태
      description: 현재 어떻게 되어 있나요? (스크린샷 첨부 권장)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 개선 제안
      description: 어떻게 바뀌었으면 하는지 설명해주세요 (시안, 참고 이미지 첨부 권장)
    validations:
      required: true
