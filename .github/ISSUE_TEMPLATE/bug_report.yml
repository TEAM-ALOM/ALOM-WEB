name: "🐛 버그 리포트"
description: "웹사이트에서 예상과 다르게 동작하는 부분을 신고합니다"
title: "[버그] "
labels: ["버그", "작업전"]
body:
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해주세요
      placeholder: 예) 모바일에서 헤더 메뉴가 겹쳐서 보입니다
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제를 재현하는 순서를 적어주세요
      placeholder: |
        1. ~페이지 접속
        2. ~버튼 클릭
        3. 에러 발생
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
      description: 정상적으로 동작했다면 어떤 결과가 나와야 하나요?
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: 환경
      description: 브라우저, OS, 디바이스 등
      placeholder: 예) Chrome 126 / macOS / iPhone 15
    validations:
      required: false
  - type: textarea
    id: screenshot
    attributes:
      label: 스크린샷 / 참고 자료
      description: 화면 캡처나 콘솔 에러 로그를 첨부해주세요
    validations:
      required: false
