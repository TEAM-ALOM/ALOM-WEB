name: "✍️ 콘텐츠 수정"
description: "웹사이트 텍스트, 이미지 등 콘텐츠 수정/추가를 요청합니다"
title: "[콘텐츠] "
labels: ["콘텐츠", "작업전"]
body:
  - type: input
    id: page
    attributes:
      label: 대상 페이지
      placeholder: 예) 소개 페이지, 활동 내역 페이지
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 현재 내용
      description: 수정이 필요한 기존 텍스트/이미지를 적어주세요
    validations:
      required: false
  - type: textarea
    id: change
    attributes:
      label: 변경 요청 내용
      description: 어떤 내용으로 바뀌어야 하는지 구체적으로 작성해주세요
    validations:
      required: true
