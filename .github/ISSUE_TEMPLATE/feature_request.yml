name: "✨ 기능 제안"
description: "웹사이트에 추가하고 싶은 기능을 제안합니다"
title: "[기능제안] "
labels: ["기능제안", "작업전"]
body:
  - type: textarea
    id: motivation
    attributes:
      label: 제안 배경
      description: 이 기능이 왜 필요한가요? 어떤 문제를 해결하나요?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안 내용
      description: 원하는 기능을 구체적으로 설명해주세요
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 대안 / 참고 사례
      description: 참고할 만한 다른 웹사이트나 대안이 있다면 적어주세요
    validations:
      required: false
